<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <title>FBX Character Viewer - With Sprite Sheet Generator (Three.js)</title>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #333;
            font-family: Arial, sans-serif;
        }
        .canvas-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        #renderCanvas {
            width: min(100vh, 100vw);
            height: min(100vh, 100vw);
            touch-action: none;
            background-color: transparent;
            background-image:
                linear-gradient(45deg, #444 25%, transparent 25%),
                linear-gradient(-45deg, #444 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #444 75%),
                linear-gradient(-45deg, transparent 75%, #444 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
        }
        .canvas-container::after {
            content: '';
            position: absolute;
            border: 1px dashed rgba(255, 255, 255, 0.2);
            width: min(100vh, 100vw);
            height: min(100vh, 100vw);
            pointer-events: none;
            z-index: 1;
        }
        #controlPanel {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 5px;
            color: white;
            z-index: 100;
            width: 230px;
        }
        #spriteSheetPanel {
            position: absolute;
            top: 300px;
            left: 10px;
            background-color: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 5px;
            color: white;
            z-index: 100;
            width: 230px;
        }
        #statusBar {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            background-color: rgba(0, 0, 0, 0.7);
            padding: 10px;
            color: white;
            text-align: center;
            z-index: 100;
        }
        button, input[type="file"], select {
            margin: 5px 0;
            padding: 8px;
            width: calc(100% - 16px);
            box-sizing: border-box;
            cursor: pointer;
            border-radius: 3px;
            border: 1px solid #555;
            background-color: #444;
            color: white;
        }
        select {
            width: 100%;
        }
        label {
            display: block;
            margin-top: 8px;
            font-size: 12px;
        }
        input[type="number"] {
            width: 70px;
            padding: 6px;
        }
        input[type="checkbox"] {
            width: auto;
            margin-right: 5px;
            vertical-align: middle;
        }
        .upload-section { 
            margin: 10px 0; 
            position: relative; 
        }
        #characterUpload { 
            opacity: 0; 
            width: 0.1px; 
            height: 0.1px; 
            position: absolute; 
        }
        .upload-label {
            display: block; 
            padding: 8px 12px; 
            background-color: #4CAF50;
            color: white; 
            border-radius: 4px; 
            cursor: pointer; 
            text-align: center;
            border: none;
        }
        .upload-label:hover { 
            background-color: #45a049; 
        }
        #recordBtn {
            background-color: #e74c3c;
            border: none;
        }
        #recordBtn:hover {
            background-color: #c0392b;
        }
        #recordBtn:disabled {
            background-color: #7f8c8d;
            cursor: not-allowed;
        }
        #cameraControlPanel {
            position: absolute;
            left: 10px;
            top: 10px;
            background-color: rgba(0,0,0,0.7);
            border-radius: 5px;
            padding: 10px;
            color: white;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        @media (max-width: 768px) {
            #cameraControlPanel { 
                transform: scale(0.8); 
                transform-origin: top left; 
            }
            #controlPanel, #spriteSheetPanel { 
                width: 180px; 
                font-size: 0.9em; 
                right:5px; 
                top:5px; 
            }
            #spriteSheetPanel { 
                top: 180px; 
            }
        }
        #cameraControlPanel button:hover { 
            background-color: #666 !important; 
        }
        #cameraControlPanel button:active { 
            background-color: #888 !important; 
        }
        #statusMessage.error { 
            color: #ff6b6b; 
        }
        #statusMessage.info { 
            color: #6bff6b; 
        }
    </style>
</head>
<body>
    <div class="canvas-container">
        <canvas id="renderCanvas"></canvas>
    </div>

    <div id="controlPanel">
        <h3>Animation Controls</h3>
        <div class="upload-section">
            <input type="file" id="characterUpload" accept=".fbx,.glb,.gltf">
            <label for="characterUpload" class="upload-label">Upload Character (.fbx/.glb)</label>
        </div>
        <select id="animationList"></select>
        
        <div style="display: flex; gap: 5px;">
            <button id="playBtn" style="flex:1;">Play</button>
            <button id="pauseBtn" style="flex:1;">Pause</button>
        </div>

        <h4 style="margin-top: 15px; margin-bottom: 5px; border-top: 1px solid #555; padding-top: 10px;">Model Materials & Textures</h4>
        <!-- Este contêiner será populado via código baseado nos materiais do modelo -->
        <div id="materialsContainer" style="max-height: 200px; overflow-y: auto; padding-right: 5px;"></div>

        <h4 style="margin-top: 15px; margin-bottom: 5px; border-top: 1px solid #555; padding-top: 10px;">Model Rotation (Deg)</h4>
        <div style="display: flex; gap: 5px; align-items: center;">
            <div style="flex: 1;">
                <label for="rotX" style="margin:0; font-size:10px;">X</label>
                <input type="number" id="rotX" value="0" step="15" style="width: 100%;">
            </div>
            <div style="flex: 1;">
                <label for="rotY" style="margin:0; font-size:10px;">Y</label>
                <input type="number" id="rotY" value="0" step="15" style="width: 100%;">
            </div>
            <div style="flex: 1;">
                <label for="rotZ" style="margin:0; font-size:10px;">Z</label>
                <input type="number" id="rotZ" value="0" step="15" style="width: 100%;">
            </div>
        </div>
        <button id="resetRotBtn" style="margin-top: 5px; font-size: 11px; background-color: #555;">Reset Rotation</button>
    </div>

    <div id="spriteSheetPanel">
        <h3>Sprite Sheet Generator</h3>
        
        <label for="captureModeSelect">Capture Mode:</label>
        <select id="captureModeSelect">
            <option value="animated">Animated (Time-based)</option>
            <option value="static">Static Model (Angles Only)</option>
        </select>

        <div id="animatedConfigSection">
            <label for="framesInput">Number of frames:</label>
            <input type="number" id="framesInput" min="1" max="128" value="16">
        </div>

        <label for="columnsInput">Columns:</label>
        <input type="number" id="columnsInput" min="1" max="16" value="4">
        
        <button id="diagnoseBtn" style="margin-top: 10px; background-color: #3498db; font-size: 11px;">Diagnose Sprite Capture</button>

        <div style="margin-top: 10px; border-top: 1px solid #555; padding-top: 10px;">
            <h4 style="margin: 5px 0; font-size: 12px;">Sprite Alignment</h4>
            <div style="display: flex; gap: 5px;">
                <button id="alignFeetBtn" style="flex:1; font-size:11px; padding: 5px;">Align Feet to Base</button>
                <button id="centerModelBtn" style="flex:1; font-size:11px; padding: 5px;">Center Model</button>
            </div>
            <div style="display: flex; gap: 5px; margin-top: 5px;">
                <button id="moveUpBtn" style="flex:1; font-size:11px; padding: 3px;">Move Up</button>
                <button id="moveDownBtn" style="flex:1; font-size:11px; padding: 3px;">Move Down</button>
            </div>
        </div>
        
        <div style="display: flex; gap: 5px; margin-top: 5px;">
            <div style="flex: 1;">
                <label for="cellWidthInput">Cell Width (px):</label>
                <input type="number" id="cellWidthInput" min="32" max="1024" value="480" style="width: 100%;">
            </div>
            <div style="flex: 1;">
                <label for="cellHeightInput">Cell Height (px):</label>
                <input type="number" id="cellHeightInput" min="32" max="1024" value="480" style="width: 100%;">
            </div>
        </div>

        <div style="display: flex; align-items: center; margin-top: 10px;">
            <input type="checkbox" id="optimizeInput" checked>
            <label for="optimizeInput" style="font-size:11px; margin-top:0; display:inline;">Center content</label>
        </div>

        <div style="display: flex; align-items: center; margin-top: 10px;">
            <input type="checkbox" id="captureIsometricToggle" checked>
            <label for="captureIsometricToggle" style="font-size:11px; margin-top:0; display:inline;">Capture 8 Isometric Angles</label>
        </div>

        <button id="recordBtn" style="margin-top: 10px;">Record Sprite Sheet</button>
        <div style="font-size: 11px; margin-top: 8px; color: #aaa;">
            Background is transparent. Content can be centered within cells.
        </div>
    </div>

    <div id="statusBar">
        <span id="statusMessage" class="info">Initializing Three.js... Select an FBX file.</span>
        <span id="keyboardHint" style="font-size: 11px; margin-left: 10px; color: #999;"></span>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.164.1/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.164.1/examples/jsm/"
        }
    }
    </script>
    
    <script type="module">
        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(() => {
                const alignFeetBtn = document.getElementById('alignFeetBtn');
                const centerModelBtn = document.getElementById('centerModelBtn');
                const moveUpBtn = document.getElementById('moveUpBtn');
                const moveDownBtn = document.getElementById('moveDownBtn');
                const diagnoseBtn = document.getElementById('diagnoseBtn');
                const captureModeSelect = document.getElementById('captureModeSelect');
                const animatedConfigSection = document.getElementById('animatedConfigSection');

                if (captureModeSelect && animatedConfigSection) {
                    captureModeSelect.addEventListener('change', function() {
                        if (this.value === 'static') {
                            animatedConfigSection.style.display = 'none';
                        } else {
                            animatedConfigSection.style.display = 'block';
                        }
                    });
                }
                
                if (alignFeetBtn) {
                    alignFeetBtn.addEventListener('click', function() {
                        if (window.alignModelToBase) window.alignModelToBase();
                    });
                }
                if (centerModelBtn) {
                    centerModelBtn.addEventListener('click', function() {
                        if (window.centerModelVertically) window.centerModelVertically();
                    });
                }
                if (moveUpBtn) {
                    moveUpBtn.addEventListener('click', function() {
                        if (window.moveModelVertical) window.moveModelVertical(0.1);
                    });
                }
                if (moveDownBtn) {
                    moveDownBtn.addEventListener('click', function() {
                        if (window.moveModelVertical) window.moveModelVertical(-0.1);
                    });
                }
                if (diagnoseBtn) {
                    diagnoseBtn.addEventListener('click', function() {
                        if (window.diagnoseSpriteCapture) window.diagnoseSpriteCapture();
                    });
                }
            }, 1000);
        });
    </script>
    
    <script type="module" src="fbxViewerThree.js"></script>
</body>
</html>
